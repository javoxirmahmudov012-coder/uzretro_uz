<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — UzRetro.uz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .login-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
        .form-control { background: #111; border: 1px solid #333; color: #fff; }
        .form-control:focus { background: #111; border-color: #007bff; color: #fff; box-shadow: 0 0 0 0.25rem rgba(0,123,255,.15); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="mb-4">
            <h3 style="color:#007bff; font-weight:800;">UZRETRO<span style="color:#fff;">.UZ</span></h3>
            <p class="text-muted">Admin Panel</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-white">Login</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white">Parol</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                🔐 Kirish
            </button>
        </form>
        
        <p class="text-muted mt-4 small">© 2024 UzRetro.uz</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
